<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>深夜博物馆</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { width:100%; height:100%; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; background:#0a0908; overflow:hidden; }

.container { position:fixed; top:0; left:50%; transform:translateX(-50%); width:100%; max-width:430px; height:100%; background:#0a0908; overflow:hidden; }

.page { position:absolute; top:0; left:0; width:100%; height:100%; display:none; flex-direction:column; }
.page.active { display:flex; }

/* ============ 通用按钮 ============ */
button { -webkit-appearance:none; appearance:none; touch-action:manipulation; border:none; cursor:pointer; font-family:inherit; outline:none; }
.btn-primary {
  padding:14px 40px; background:transparent; color:#e8e0d4;
  border:1px solid rgba(232,224,212,0.25); border-radius:0;
  font-size:14px; font-weight:300; letter-spacing:4px;
  transition:all 0.4s ease; position:relative;
}
.btn-primary:hover { background:rgba(232,224,212,0.08); border-color:rgba(232,224,212,0.5); }
.btn-primary:active { transform:scale(0.97); }
.btn-secondary {
  padding:12px 32px; background:transparent; color:rgba(232,224,212,0.6);
  border:1px solid rgba(232,224,212,0.12); font-size:13px;
  letter-spacing:2px; transition:all 0.3s;
}
.btn-secondary:hover { border-color:rgba(232,224,212,0.3); color:#e8e0d4; }

/* ============ 入馆页 ============ */
#entryPage {
  background:radial-gradient(ellipse at 50% 30%, #1a1714 0%, #0a0908 70%);
  justify-content:center; align-items:center; text-align:center; padding:40px 32px;
}
.entry-glow {
  position:absolute; top:40%; left:50%; transform:translate(-50%,-50%);
  width:200px; height:200px;
  background:radial-gradient(circle, rgba(232,224,212,0.06) 0%, transparent 70%);
  animation:glowPulse 5s ease-in-out infinite;
}
@keyframes glowPulse { 0%,100%{opacity:0.4;} 50%{opacity:0.8;} }

.museum-icon {
  width:56px; height:56px; border:1px solid rgba(232,224,212,0.15);
  border-radius:50%; display:flex; align-items:center; justify-content:center;
  margin-bottom:36px; position:relative; z-index:2;
}
.museum-icon::before {
  content:''; width:18px; height:18px; border:1px solid rgba(232,224,212,0.25);
  transform:rotate(45deg);
}

.entry-text-wrap { min-height:140px; display:flex; flex-direction:column; justify-content:center; gap:16px; position:relative; z-index:2; }
.entry-line { font-size:13px; color:rgba(232,224,212,0.35); letter-spacing:2px; opacity:0; transform:translateY(10px); transition:all 1s ease; }
.entry-line.show { opacity:1; transform:translateY(0); }
.entry-line.final { font-size:28px; color:#e8e0d4; font-weight:300; letter-spacing:8px; margin-top:8px; }

#enterBtn { margin-top:48px; opacity:0; transition:opacity 1s ease; position:relative; z-index:2; }
#enterBtn.show { opacity:1; }

.open-time { font-size:11px; color:rgba(232,224,212,0.15); letter-spacing:3px; margin-top:40px; }

/* ============ 灰尘粒子 ============ */
.dust { position:absolute; width:2px; height:2px; background:rgba(255,240,220,0.12); border-radius:50%; animation:float-dust linear infinite; pointer-events:none; }
@keyframes float-dust {
  0% { transform:translateY(0) translateX(0); opacity:0; }
  20% { opacity:0.25; }
  80% { opacity:0.25; }
  100% { transform:translateY(-80px) translateX(20px); opacity:0; }
}

/* ============ 问卷页通用 ============ */
.step-page { background:#0a0908; justify-content:space-between; padding:48px 28px 32px; }
.step-header { text-align:center; }
.step-progress { font-size:11px; color:rgba(232,224,212,0.25); letter-spacing:3px; margin-bottom:20px; }
.step-title { font-size:20px; color:#e8e0d4; font-weight:300; letter-spacing:1px; }
.step-body { flex:1; display:flex; flex-direction:column; justify-content:center; gap:20px; }
.step-footer { display:flex; justify-content:center; }

/* ============ 时间滑块 ============ */
.time-display { text-align:center; font-size:48px; color:#e8e0d4; font-weight:200; letter-spacing:4px; margin-bottom:6px; }
.time-period { text-align:center; font-size:13px; color:rgba(232,224,212,0.4); margin-bottom:32px; letter-spacing:2px; }
#timeSlider {
  width:100%; height:2px; -webkit-appearance:none; appearance:none;
  background:rgba(232,224,212,0.1); border-radius:1px; outline:none;
}
#timeSlider::-webkit-slider-thumb {
  -webkit-appearance:none; width:18px; height:18px; border-radius:50%;
  background:#e8e0d4; box-shadow:0 0 12px rgba(232,224,212,0.3); cursor:pointer;
}
.time-hint { text-align:center; font-size:12px; color:rgba(232,224,212,0.25); margin-top:28px; line-height:1.8; }

/* ============ 活动选择网格 ============ */
.activity-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.activity-card {
  background:rgba(232,224,212,0.02); border:1px solid rgba(232,224,212,0.06);
  border-radius:0; padding:16px 8px; text-align:center; transition:all 0.3s ease;
}
.activity-card .a-icon { font-size:24px; display:block; margin-bottom:6px; }
.activity-card .a-label { font-size:13px; color:rgba(232,224,212,0.5); }
.activity-card.selected { background:rgba(232,224,212,0.06); border-color:rgba(232,224,212,0.25); }
.activity-card.selected .a-label { color:#e8e0d4; }
.activity-card:active { transform:scale(0.96); }

/* ============ 情绪球 ============ */
.mood-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:20px 12px; padding:0 8px; }
.mood-orb-wrap { display:flex; flex-direction:column; align-items:center; gap:8px; }
.mood-orb {
  width:56px; height:56px; border-radius:50%; transition:all 0.3s ease;
  display:flex; align-items:center; justify-content:center; position:relative;
  border:1.5px solid transparent;
}
.mood-orb.selected { transform:scale(1.12); border-color:currentColor; box-shadow:0 0 20px currentColor; }
.mood-orb-wrap:active .mood-orb { transform:scale(0.92); }
.mood-label { font-size:12px; color:rgba(232,224,212,0.4); }
.mood-orb-wrap.selected .mood-label { color:#e8e0d4; }

/* ============ 加载页 ============ */
#loadingPage { background:#0a0908; justify-content:center; align-items:center; padding:40px; }
.loading-wrap { text-align:center; width:100%; }
.loading-number { font-size:48px; font-weight:200; color:rgba(232,224,212,0.1); letter-spacing:4px; margin-bottom:28px; }
.loading-text { font-size:13px; color:rgba(232,224,212,0.3); letter-spacing:6px; font-weight:300; }

/* ============ 结果页 ============ */
#resultPage { background:#0a0908; overflow-y:auto; padding:0; -webkit-overflow-scrolling:touch; }
#resultPage::-webkit-scrollbar { width:0; }

.spotlight {
  position:absolute; width:100%; height:100%;
  background:radial-gradient(ellipse 100px 180px at 50% 30%, rgba(255,240,220,0.05) 0%, transparent 60%);
  pointer-events:none; z-index:1;
}

.result-header { position:relative; padding:48px 24px 16px; text-align:center; }
.museum-eyebrow { font-size:10px; color:rgba(232,224,212,0.2); letter-spacing:4px; position:relative; z-index:2; }

.exhibit-card {
  margin:0 20px 0; background:linear-gradient(165deg,#f4ecd8,#ebe0c8); border-radius:2px;
  padding:32px 24px 28px; position:relative;
  box-shadow:0 16px 40px rgba(0,0,0,0.5);
}
.exhibit-card::before {
  content:''; position:absolute; inset:6px; border:1px solid rgba(61,43,31,0.12); pointer-events:none;
}
.exhibit-card.rare {
  background:linear-gradient(165deg,#f4ecd8,#ebe0c8);
  box-shadow:0 0 30px rgba(212,165,116,0.3), 0 16px 40px rgba(0,0,0,0.5);
}
.exhibit-card.rare::before {
  border:1.5px solid rgba(212,165,116,0.4);
}
.rare-badge {
  position:absolute; top:12px; right:12px;
  font-size:10px; color:#a8895f; letter-spacing:2px;
  border:1px solid rgba(168,137,95,0.3); padding:4px 10px;
}
.reveal-item { opacity:0; transform:translateY(12px); transition:all 0.8s ease; }
.reveal-item.show { opacity:1; transform:translateY(0); }

.ex-number { font-size:11px; color:#a8895f; letter-spacing:4px; text-align:center; margin-bottom:16px; font-weight:600; }
.ex-title { font-family:Georgia,"Songti SC","STSong",serif; font-size:22px; color:#3d2b1f; text-align:center; font-weight:700; line-height:1.5; margin-bottom:20px; }
.ex-meta { display:flex; flex-direction:column; gap:6px; align-items:center; padding-bottom:18px; margin-bottom:18px; border-bottom:1px dashed rgba(61,43,31,0.2); }
.ex-meta-row { font-size:12px; color:#7a6552; }
.ex-meta-row b { color:#3d2b1f; font-weight:600; }
.ex-desc { font-family:Georgia,"Songti SC","STSong",serif; font-size:14px; color:#4a3829; line-height:2.2; white-space:pre-line; text-align:left; }

.result-actions { display:flex; gap:12px; padding:28px 24px 0; justify-content:center; }
.result-actions button { padding:12px 28px; font-size:13px; letter-spacing:2px; }
#saveBtn { background:transparent; color:#e8e0d4; border:1px solid rgba(232,224,212,0.2); }
#shareBtn { background:transparent; color:rgba(232,224,212,0.5); border:1px solid rgba(232,224,212,0.1); }

/* 馆长精选 */
.curator-section { padding:32px 24px 10px; }
.curator-title { font-size:11px; color:rgba(232,224,212,0.3); letter-spacing:3px; margin-bottom:16px; display:flex; align-items:center; gap:10px; }
.curator-title::before, .curator-title::after { content:''; flex:1; height:1px; background:rgba(232,224,212,0.08); }
.curator-card {
  background:rgba(232,224,212,0.02); border:1px solid rgba(232,224,212,0.06); border-radius:0;
  padding:14px 16px; margin-bottom:10px; transition:all 0.3s;
}
.curator-card-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px; }
.curator-card-title { font-size:14px; color:#e8c4a0; font-weight:600; font-family:Georgia,"Songti SC",serif; }
.curator-card-num { font-size:10px; color:rgba(232,224,212,0.25); letter-spacing:1px; }
.curator-card-tag { font-size:11px; color:rgba(232,224,212,0.35); }
.curator-card-snippet { font-size:12px; color:rgba(232,224,212,0.3); line-height:1.7; margin-top:8px; max-height:0; overflow:hidden; opacity:0; transition:all 0.4s; }
.curator-card.expanded .curator-card-snippet { max-height:200px; opacity:1; margin-top:8px; }
.curator-card-hint { font-size:10px; color:rgba(232,224,212,0.15); margin-top:6px; }

.result-footer { padding:24px 24px 40px; text-align:center; }

/* ============ 隐藏分享门票 ============ */
#shareCard {
  position:fixed; top:-9999px; left:-9999px; width:375px;
  background:#0a0908; padding:0; overflow:hidden;
}
.ticket-inner { padding:40px 28px; position:relative; text-align:center; }
.ticket-top { margin-bottom:32px; }
.ticket-museum-name { font-size:11px; color:rgba(232,224,212,0.3); letter-spacing:4px; margin-bottom:4px; }
.ticket-sub { font-size:9px; color:rgba(232,224,212,0.15); letter-spacing:3px; }
.ticket-divider { width:40px; height:1px; background:rgba(232,224,212,0.15); margin:0 auto 28px; }
.ticket-number { font-size:12px; color:#a8895f; letter-spacing:3px; margin-bottom:20px; }
.ticket-title { font-family:Georgia,"Songti SC",serif; font-size:24px; color:#e8e0d4; font-weight:700; margin-bottom:12px; line-height:1.4; }
.ticket-tag { font-size:13px; color:rgba(232,224,212,0.5); margin-bottom:32px; }
.ticket-time { font-size:11px; color:rgba(232,224,212,0.25); margin-bottom:40px; }
.ticket-quote { font-family:Georgia,"Songti SC",serif; font-size:14px; color:rgba(232,224,212,0.4); line-height:2; max-width:280px; margin:0 auto 40px; font-style:italic; }
.ticket-bottom { border-top:1px solid rgba(232,224,212,0.08); padding-top:20px; }
.ticket-brand { font-size:10px; color:rgba(232,224,212,0.15); letter-spacing:3px; }
</style>
</head>
<body>
<div class="container">

  <!-- 入馆页 -->
  <div id="entryPage" class="page active">
    <div class="entry-glow"></div>
    <div class="museum-icon"></div>
    <div class="entry-text-wrap" id="entryTextWrap"></div>
    <button id="enterBtn" type="button" class="btn-primary">走进博物馆</button>
    <div class="open-time">OPEN 22:00 — 04:00</div>
    <div id="dust-container" style="position:absolute;width:100%;height:100%;pointer-events:none;z-index:1;"></div>
  </div>

  <!-- Step1 时间 -->
  <div id="timeStepPage" class="page step-page">
    <div class="step-header">
      <div class="step-progress">STEP 1 / 3</div>
      <div class="step-title">此刻，几点了？</div>
    </div>
    <div class="step-body">
      <div class="time-display" id="timeDisplay">23:00</div>
      <div class="time-period" id="timePeriod">深夜</div>
      <input type="range" id="timeSlider" min="0" max="23" value="23" step="1">
      <div class="time-hint">博物馆只为深夜的心事开放<br>拖动调整成你此刻所在的时间</div>
    </div>
    <div class="step-footer">
      <button id="timeNextBtn" type="button" class="btn-primary">确认</button>
    </div>
  </div>

  <!-- Step2 活动 -->
  <div id="activityStepPage" class="page step-page">
    <div class="step-header">
      <div class="step-progress">STEP 2 / 3</div>
      <div class="step-title">你正在做什么？</div>
    </div>
    <div class="step-body">
      <div class="activity-grid" id="activityGrid"></div>
    </div>
    <!-- 活动选择点击即跳转，无需按钮 -->
  </div>

  <!-- Step3 情绪 -->
  <div id="moodStepPage" class="page step-page">
    <div class="step-header">
      <div class="step-progress">STEP 3 / 3</div>
      <div class="step-title">此刻的感觉？</div>
    </div>
    <div class="step-body">
      <div class="mood-grid" id="moodGrid"></div>
    </div>
    <!-- 情绪选择点击即跳转，无需按钮 -->
  </div>

  <!-- 加载页 -->
  <div id="loadingPage" class="page">
    <div class="loading-wrap">
      <div class="loading-number" id="loadingNumber"># ----</div>
      <div class="loading-text" id="loadingText">正在调取馆藏记录...</div>
    </div>
  </div>

  <!-- 结果页 -->
  <div id="resultPage" class="page">
    <div class="spotlight"></div>
    <div class="result-header">
      <div class="museum-eyebrow">深夜博物馆 · 当代情绪标本馆</div>
    </div>

    <div class="exhibit-card">
      <div class="ex-number reveal-item" id="exNumber"></div>
      <div class="ex-title reveal-item" id="exTitle"></div>
      <div class="ex-meta reveal-item" id="exMeta"></div>
      <div class="ex-desc reveal-item" id="exDesc"></div>
    </div>

    <div class="result-actions">
      <button id="saveBtn" type="button">保存门票</button>
      <button id="shareBtn" type="button">分享</button>
    </div>

    <div class="curator-section">
      <div class="curator-title">馆长精选 · 今夜其他展区的回响</div>
      <div id="curatorList"></div>
    </div>

    <div class="curator-section" style="padding-top:16px;">
      <div class="curator-title">馆长结语</div>
      <div style="font-size:13px;color:rgba(232,224,212,0.45);line-height:2;text-align:center;padding:0 24px 16px;" id="curatorClosing">
        今晚收录的展品中，有许多和你一样。<br>
        但每一件，都是独一无二的。
      </div>
    </div>

    <div class="result-footer">
      <button id="retestBtn" type="button" class="btn-secondary">重新入馆</button>
      <button id="historyBtn" type="button" class="btn-secondary" style="margin-top:12px;">我的馆藏</button>
    </div>
  </div>

  <!-- 个人馆藏历史页 -->
  <div id="historyPage" class="page" style="background:#0a0908; overflow-y:auto; -webkit-overflow-scrolling:touch;">
    <div class="result-header" style="padding:48px 24px 24px;">
      <div class="museum-eyebrow">深夜博物馆 · 个人馆藏记录</div>
    </div>
    <div id="historyList" style="padding:0 20px 40px;"></div>
    <div style="text-align:center; padding-bottom:40px;">
      <button id="backFromHistory" type="button" class="btn-secondary">返回</button>
    </div>
  </div>

  <!-- 隐藏分享门票 -->
  <div id="shareCard">
    <div class="ticket-inner">
      <div class="ticket-top">
        <div class="ticket-museum-name">深夜博物馆</div>
        <div class="ticket-sub">MIDNIGHT MUSEUM</div>
      </div>
      <div class="ticket-divider"></div>
      <div style="font-size:18px;color:#e8e0d4;font-weight:700;margin-bottom:16px;letter-spacing:2px;">今晚，我被深夜博物馆收录了</div>
      <div class="ticket-number" id="ticketNumber"></div>
      <div class="ticket-title" id="ticketTitle"></div>
      <div class="ticket-tag" id="ticketTag"></div>
      <div class="ticket-time" id="ticketTime"></div>
      <div class="ticket-quote" id="ticketQuote"></div>
      <div style="font-size:13px;color:rgba(232,224,212,0.4);margin-bottom:32px;">今晚，你也会成为馆藏吗？</div>
      <div style="font-size:12px;color:#a8895f;letter-spacing:3px;margin-bottom:32px;border:1px solid rgba(168,137,95,0.3);padding:8px 16px;display:inline-block;">永久收录于深夜博物馆</div>
      <div class="ticket-bottom">
        <div class="ticket-brand">深夜博物馆 · 永远为你开放</div>
      </div>
    </div>
  </div>

</div>

<script>
/* ============================================================
   数据层
   ============================================================ */
const ACTIVITIES = [
  { id:'phone',   icon:'📱', label:'刷手机',   title:'第47次刷新',         verb:'划动着没有尽头的信息', zone:'digital',  code:'A' },
  { id:'eating',  icon:'🍜', label:'吃东西',   title:'已经冷掉的泡面',     verb:'为自己煮了一点东西',   zone:'selfcare', code:'B' },
  { id:'blank',   icon:'💭', label:'发呆',     title:'天花板上的空白',     verb:'望着某个不存在的地方', zone:'silent',   code:'C' },
  { id:'waiting', icon:'⏳', label:'等消息',   title:'未发送的草稿箱',     verb:'等着一条还没出现的消息', zone:'waiting',  code:'D' },
  { id:'working', icon:'💻', label:'工作学习', title:'光标在第三段闪烁',   verb:'和未完成的任务较劲',   zone:'labor',    code:'E' },
  { id:'music',   icon:'🎧', label:'听歌',     title:'耳机里的避难所',     verb:'把自己交给一段旋律',   zone:'sound',    code:'F' },
  { id:'sleeping',icon:'🌙', label:'准备睡觉', title:'静音模式',           verb:'把白天的自己慢慢关闭', zone:'selfcare', code:'G' },
  { id:'other',   icon:'🌫️', label:'其他',     title:'无法对焦的此刻',     verb:'做着一件说不清的事',   zone:'silent',   code:'H' }
];

const MOODS = [
  { id:'calm',      label:'平静',     tag:'平静的安顿',       reflection:'这种平静不是麻木，而是终于把自己安放好了。',           code:'1', color:'#8ba888' },
  { id:'annoyed',   label:'有点烦',   tag:'压抑的躁动',       reflection:'烦躁的背后，往往是一些没有出口的在意。',               code:'2', color:'#c97b5f' },
  { id:'empty',     label:'空的',     tag:'空白的容器',       reflection:'空，有时不是缺失，而是刚好留出了喘息的余地。',         code:'3', color:'#a8a8a8' },
  { id:'satisfied', label:'还挺满足', tag:'孤独中的满足',     reflection:'没有人见证的满足，反而更接近真实。',                  code:'4', color:'#d4a574' },
  { id:'unclear',   label:'说不清',   tag:'模糊的边界',       reflection:'说不清的情绪最值得被留意，它往往藏着尚未被听见的话。', code:'5', color:'#9b8aa8' },
  { id:'sad',       label:'有点难过', tag:'沉默的重量',       reflection:'难过没有被说出来，但这件作品替你说了。',              code:'6', color:'#6b8caf' }
];

const ZONES = {
  digital:  { name:'数字孤独展区',     philosophy:'手指的滑动是这个时代最沉默的语言。屏幕照亮了脸，却照不进心里。' },

    visual: '你靠在椅背上，长长地呼出一口气。这种满足感很轻，但足够让你微笑一下。没有人看见，但你知道自己做到了。',
    philosophy: '深夜完成的满足，有一种特殊的甜味。因为那是偷来的时间，是只属于你自己的胜利。',
    closing: '这件作品致敬所有在深夜偷偷完成任务的人。'
  }
};

/* ============================================================
   生成逻辑
   ============================================================ */
function getTimePeriod(hour) {
  if (hour >= 0 && hour < 5) return '凌晨';
  if (hour >= 5 && hour < 12) return '上午';
  if (hour >= 12 && hour < 18) return '下午';
  if (hour >= 18 && hour < 23) return '夜里';
  return '深夜';
}

function generateMuseumNumber(hour, activityCode, moodCode) {
  return 'No.' + String(hour).padStart(2,'0') + activityCode + moodCode;
}

function composeExhibit(hour, minute, activity, mood) {
  var zone = ZONES[activity.zone];
  var period = getTimePeriod(hour);
  var timeStr = period + hour + ':' + String(minute).padStart(2,'0');
  var number = generateMuseumNumber(hour, activity.code, mood.code);

  // 稀有馆藏：隐藏组合触发（特定时间+特定活动+特定情绪）
  var status = '普通馆藏';
  var isRare = false;
  // 隐藏稀有组合：
  // 03:33 + 等消息 + 说不清
  if (hour === 3 && minute === 33 && activity.id === 'waiting' && mood.id === 'unclear') isRare = true;
  // 00:00 + 发呆 + 空的
  if (hour === 0 && minute === 0 && activity.id === 'blank' && mood.id === 'empty') isRare = true;
  // 02:17 + 听歌 + 有点难过
  if (hour === 2 && minute === 17 && activity.id === 'music' && mood.id === 'sad') isRare = true;
  // 04:44 + 准备睡觉 + 平静
  if (hour === 4 && minute === 44 && activity.id === 'sleeping' && mood.id === 'calm') isRare = true;
  // 01:11 + 工作学习 + 有点烦
  if (hour === 1 && minute === 11 && activity.id === 'working' && mood.id === 'annoyed') isRare = true;
  // 23:23 + 刷手机 + 平静
  if (hour === 23 && minute === 23 && activity.id === 'phone' && mood.id === 'calm') isRare = true;

  if (isRare) status = '稀有馆藏';
  else if (hour >= 0 && hour <= 5) status = '深夜特藏';

  // 查找专属文案，没有则用通用模板
  var key = activity.id + '_' + mood.id;
  var exhibit = EXHIBITS[key];

  var desc;
  if (exhibit) {
    desc = exhibit.intro + '\n\n' + exhibit.visual + '\n\n' + exhibit.philosophy + '\n\n' + exhibit.closing;
  } else {
    desc = '这件作品记录了' + timeStr + '，一个人' + activity.verb + '的瞬间。\n\n' +
           zone.philosophy + '\n\n' +
           mood.reflection + '\n\n' +
           '策展人将这一刻归类为「' + mood.tag + '」，陈列于' + zone.name + '。在这个被快速划过的时代，这样的瞬间值得被留下来看一眼。';
  }

  var today = new Date();
  var collectDate = today.getFullYear() + '.' + String(today.getMonth()+1).padStart(2,'0') + '.' + String(today.getDate()).padStart(2,'0');

  return {
    number: number,
    title: activity.title,
    tag: mood.tag,
    zoneName: zone.name,
    timeStr: timeStr,
    description: desc,
    moodColor: mood.color,
    status: status,
    collectDate: collectDate
  };
}

/* ============================================================
   状态
   ============================================================ */
var selectedHour = new Date().getHours();
var selectedMinute = new Date().getMinutes();
var selectedActivity = null;
var selectedMood = null;
var currentExhibit = null;
var activityTimeoutId = null;
var moodTimeoutId = null;

/* ============================================================
   页面切换
   ============================================================ */
var pages = {
  entry: document.getElementById('entryPage'),
  time: document.getElementById('timeStepPage'),
  activity: document.getElementById('activityStepPage'),
  mood: document.getElementById('moodStepPage'),
  loading: document.getElementById('loadingPage'),
  result: document.getElementById('resultPage'),
  history: document.getElementById('historyPage')
};

function showPage(key) {
  Object.values(pages).forEach(function(p) { p.classList.remove('active'); });
  pages[key].classList.add('active');
}

/* ============================================================
   灰尘粒子
   ============================================================ */
function createDust() {
  var container = document.getElementById('dust-container');
  if (!container) return;
  for (var i = 0; i < 12; i++) {
    var dust = document.createElement('div');
    dust.className = 'dust';
    dust.style.left = (20 + Math.random() * 60) + '%';
    dust.style.top = (20 + Math.random() * 60) + '%';
    dust.style.animationDuration = (Math.random() * 5 + 4) + 's';
    dust.style.animationDelay = Math.random() * 4 + 's';
    container.appendChild(dust);
  }
}

/* ============================================================
   入馆动画
   ============================================================ */
var entryLines = ['博物馆已闭馆','但午夜的灯，一盏一盏亮了起来','今晚，有人来了'];

function playEntryAnimation() {
  var wrap = document.getElementById('entryTextWrap');
  var icon = document.querySelector('.museum-icon');
  wrap.innerHTML = '';

  entryLines.forEach(function(line, i) {
    var div = document.createElement('div');
    div.className = 'entry-line';
    div.textContent = line;
    wrap.appendChild(div);
    setTimeout(function() { div.classList.add('show'); }, 600 + i * 1200);
  });

  var finalDiv = document.createElement('div');
  finalDiv.className = 'entry-line final';
  finalDiv.textContent = '欢迎';
  wrap.appendChild(finalDiv);
  var finalDelay = 600 + entryLines.length * 1200;
  setTimeout(function() { finalDiv.classList.add('show'); }, finalDelay);

  var enterBtn = document.getElementById('enterBtn');
  enterBtn.classList.remove('show');
  setTimeout(function() { enterBtn.classList.add('show'); }, finalDelay + 600);
}

/* ============================================================
   Step1 时间滑块
   ============================================================ */
var timeSlider = document.getElementById('timeSlider');
var timeDisplay = document.getElementById('timeDisplay');
var timePeriodEl = document.getElementById('timePeriod');

function updateTimeDisplay() {
  var h = parseInt(timeSlider.value, 10);
  selectedHour = h;
  timeDisplay.textContent = String(h).padStart(2,'0') + ':' + String(selectedMinute).padStart(2,'0');
  timePeriodEl.textContent = getTimePeriod(h);
}

timeSlider.value = selectedHour;
updateTimeDisplay();
timeSlider.addEventListener('input', updateTimeDisplay);

document.getElementById('timeNextBtn').addEventListener('click', function(e) {
  e.preventDefault();
  showPage('activity');
});

/* ============================================================
   Step2 活动选择
   ============================================================ */
var activityGrid = document.getElementById('activityGrid');
ACTIVITIES.forEach(function(act) {
  var card = document.createElement('div');
  card.className = 'activity-card';
  card.innerHTML = '<span class="a-icon">' + act.icon + '</span><span class="a-label">' + act.label + '</span>';
  card.addEventListener('click', function() {
    if (activityTimeoutId) clearTimeout(activityTimeoutId);
    document.querySelectorAll('.activity-card').forEach(function(c) { c.classList.remove('selected'); });
    card.classList.add('selected');
    selectedActivity = act;
    activityTimeoutId = setTimeout(function() { showPage('mood'); }, 350);
  });
  activityGrid.appendChild(card);
});

/* activityNextBtn保留但不再必须点击 */

/* ============================================================
   Step3 情绪选择
   ============================================================ */
var moodGrid = document.getElementById('moodGrid');
MOODS.forEach(function(mood) {
  var wrap = document.createElement('div');
  wrap.className = 'mood-orb-wrap';
  wrap.style.color = mood.color;

  var orb = document.createElement('div');
  orb.className = 'mood-orb';
  orb.style.background = mood.color + '30';
  orb.style.borderColor = mood.color + '50';

  var label = document.createElement('div');
  label.className = 'mood-label';
  label.textContent = mood.label;

  wrap.appendChild(orb);
  wrap.appendChild(label);

  wrap.addEventListener('click', function() {
    if (moodTimeoutId) clearTimeout(moodTimeoutId);
    document.querySelectorAll('.mood-orb-wrap').forEach(function(w) {
      w.classList.remove('selected');
      w.querySelector('.mood-orb').classList.remove('selected');
    });
    wrap.classList.add('selected');
    orb.classList.add('selected');
    selectedMood = mood;
    moodTimeoutId = setTimeout(function() { showPage('loading'); runLoadingSequence(); }, 400);
  });

  moodGrid.appendChild(wrap);
});

/* moodNextBtn保留但不再必须点击 */

/* ============================================================
   加载序列 - 数字滚动 + 文字序列
   ============================================================ */
var loadingTexts = [
  '正在调取馆藏记录...',
  '比对相似夜晚...',
  '寻找对应展区...',
  '策展人正在撰写说明...',
  '完成收录'
];

function runLoadingSequence() {
  var numEl = document.getElementById('loadingNumber');
  var textEl = document.getElementById('loadingText');
  var count = 0;
  var finalNum = generateMuseumNumber(selectedHour, selectedActivity.code, selectedMood.code).replace('No.','');

  var interval = setInterval(function() {
    count++;
    var display = String(Math.floor(Math.random() * 9999)).padStart(4, '0');
    numEl.textContent = '# ' + display;

    // 每3次切换一行文字
    var textIndex = Math.min(Math.floor(count / 3), loadingTexts.length - 1);
    textEl.textContent = loadingTexts[textIndex];

    if (count >= 15) {
      clearInterval(interval);
      numEl.textContent = '# ' + finalNum;
      textEl.textContent = '展品已准备';
      setTimeout(function() {
        currentExhibit = composeExhibit(selectedHour, selectedMinute, selectedActivity, selectedMood);
        saveToHistory(currentExhibit);
        renderResult(currentExhibit);
        showPage('result');
      }, 800);
    }
  }, 120);
}

/* ============================================================
   结果页渲染 + 分层揭示
   ============================================================ */
function renderResult(ex) {
  var card = document.querySelector('.exhibit-card');
  card.classList.remove('rare');
  var existingBadge = card.querySelector('.rare-badge');
  if (existingBadge) existingBadge.remove();

  if (ex.status === '稀有馆藏' || ex.status === '深夜特藏') {
    card.classList.add('rare');
    var badge = document.createElement('div');
    badge.className = 'rare-badge';
    badge.textContent = 'SPECIAL COLLECTION';
    card.appendChild(badge);
  }

  document.getElementById('exNumber').textContent = ex.number;
  document.getElementById('exTitle').textContent = '《' + ex.title + '》';
  document.getElementById('exMeta').innerHTML =
    '<div class="ex-meta-row">分类：<b>' + ex.tag + '</b></div>' +
    '<div class="ex-meta-row">时间：<b>' + ex.timeStr + '</b></div>' +
    '<div class="ex-meta-row">馆区：<b>' + ex.zoneName + '</b></div>' +
    '<div class="ex-meta-row">收录时间：<b>' + ex.collectDate + '</b></div>' +
    '<div class="ex-meta-row">馆藏状态：<b>' + ex.status + '</b></div>';
  document.getElementById('exDesc').textContent = ex.description;

  document.querySelectorAll('.reveal-item').forEach(function(el) { el.classList.remove('show'); });
  var order = ['exNumber','exTitle','exMeta','exDesc'];
  order.forEach(function(id, i) {
    setTimeout(function() { document.getElementById(id).classList.add('show'); }, 300 + i * 600);
  });

  // 震动反馈（如果支持）
  if (navigator.vibrate) navigator.vibrate(50);

  // 门票数据
  document.getElementById('ticketNumber').textContent = ex.number;
  document.getElementById('ticketTitle').textContent = '《' + ex.title + '》';
  document.getElementById('ticketTag').textContent = ex.tag;
  document.getElementById('ticketTime').textContent = ex.timeStr + ' · ' + ex.zoneName;
  document.getElementById('ticketQuote').textContent = ex.description.split('\n\n')[2] || ex.description;

  renderCuratorPicks();
  document.getElementById('resultPage').scrollTop = 0;
}

/* ============================================================
   馆长精选
   ============================================================ */
var CURATOR_SEEDS = [
  { hour:2,  activityId:'waiting',  moodId:'unclear' },
  { hour:1,  activityId:'music',    moodId:'sad' },
  { hour:3,  activityId:'working',  moodId:'annoyed' },
  { hour:4,  activityId:'blank',    moodId:'empty' },
  { hour:0,  activityId:'phone',    moodId:'calm' },
  { hour:23, activityId:'eating',   moodId:'satisfied' }
];

function renderCuratorPicks() {
  var list = document.getElementById('curatorList');
  list.innerHTML = '';

  var currentZoneName = ZONES[selectedActivity.zone].name;
  var candidates = CURATOR_SEEDS
    .map(function(seed) {
      var act = ACTIVITIES.find(function(a) { return a.id === seed.activityId; });
      var mood = MOODS.find(function(m) { return m.id === seed.moodId; });
      return composeExhibit(seed.hour, Math.floor(Math.random()*60), act, mood);
    })
    .filter(function(ex) { return ex.zoneName !== currentZoneName; });

  var picks = candidates.sort(function() { return Math.random() - 0.5; }).slice(0, 3);

  picks.forEach(function(ex) {
    var card = document.createElement('div');
    card.className = 'curator-card';
    card.innerHTML =
      '<div class="curator-card-head">' +
        '<div class="curator-card-title">《' + ex.title + '》</div>' +
        '<div class="curator-card-num">' + ex.number + '</div>' +
      '</div>' +
      '<div class="curator-card-tag">' + ex.tag + ' · ' + ex.zoneName + '</div>' +
      '<div class="curator-card-snippet">' + ex.description + '</div>' +
      '<div class="curator-card-hint">点击查看策展说明</div>';
    card.addEventListener('click', function() { card.classList.toggle('expanded'); });
    list.appendChild(card);
  });
}

/* ============================================================
   保存 / 分享
   ============================================================ */
document.getElementById('saveBtn').addEventListener('click', function(e) {
  e.preventDefault();
  var card = document.getElementById('shareCard');
  card.style.top = '0';
  card.style.left = '0';
  html2canvas(card, { backgroundColor:'#0a0908', scale:2, logging:false }).then(function(canvas) {
    card.style.top = '-9999px';
    card.style.left = '-9999px';
    var link = document.createElement('a');
    link.href = canvas.toDataURL('image/png');
    link.download = '深夜博物馆_' + currentExhibit.number + '.png';
    link.click();
  });
});

document.getElementById('shareBtn').addEventListener('click', function(e) {
  e.preventDefault();
  var card = document.getElementById('shareCard');
  card.style.top = '0';
  card.style.left = '0';
  html2canvas(card, { backgroundColor:'#0a0908', scale:2, logging:false }).then(function(canvas) {
    card.style.top = '-9999px';
    card.style.left = '-9999px';
    canvas.toBlob(function(blob) {
      var file = new File([blob], '深夜博物馆_' + currentExhibit.number + '.png', { type:'image/png' });
      if (navigator.share && navigator.canShare && navigator.canShare({ files:[file] })) {
        navigator.share({
          files:[file],
          title:'我在深夜博物馆被收录了 ' + currentExhibit.number,
          text:currentExhibit.tag
        }).catch(function(){});
      } else {
        var link = document.createElement('a');
        link.href = canvas.toDataURL('image/png');
        link.download = '深夜博物馆_' + currentExhibit.number + '.png';
        link.click();
      }
    });
  });
});

/* ============================================================
   重新入馆
   ============================================================ */
document.getElementById('retestBtn').addEventListener('click', function(e) {
  e.preventDefault();
  selectedActivity = null;
  selectedMood = null;
  document.querySelectorAll('.activity-card').forEach(function(c) { c.classList.remove('selected'); });
  document.querySelectorAll('.mood-orb-wrap').forEach(function(w) {
    w.classList.remove('selected');
    w.querySelector('.mood-orb').classList.remove('selected');
  });
  selectedMinute = new Date().getMinutes();
  selectedHour = new Date().getHours();
  timeSlider.value = selectedHour;
  updateTimeDisplay();
  showPage('entry');
  playEntryAnimation();
});

/* ============================================================
   个人馆藏历史记录
   ============================================================ */
function saveToHistory(exhibit) {
  try {
    var history = JSON.parse(localStorage.getItem('midnight_museum_history') || '[]');
    history.unshift({
      number: exhibit.number,
      title: exhibit.title,
      tag: exhibit.tag,
      zoneName: exhibit.zoneName,
      timeStr: exhibit.timeStr,
      status: exhibit.status,
      collectDate: exhibit.collectDate,
      timestamp: Date.now()
    });
    // 最多保存20条
    if (history.length > 20) history = history.slice(0, 20);
    localStorage.setItem('midnight_museum_history', JSON.stringify(history));
  } catch(e) {}
}

function renderHistory() {
  var list = document.getElementById('historyList');
  var history = [];
  try {
    history = JSON.parse(localStorage.getItem('midnight_museum_history') || '[]');
  } catch(e) {}

  if (history.length === 0) {
    list.innerHTML = '<div style="text-align:center;color:rgba(232,224,212,0.3);font-size:13px;padding:60px 20px;">还没有馆藏记录<br>完成一次参观后，你的展品会出现在这里</div>';
    return;
  }

  var html = '';
  history.forEach(function(item) {
    var isRare = item.status === '稀有馆藏';
    html +=
      '<div style="background:rgba(232,224,212,0.02);border:1px solid ' + (isRare ? 'rgba(212,165,116,0.3)' : 'rgba(232,224,212,0.06)') + ';padding:16px;margin-bottom:10px;">' +
        '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;">' +
          '<div style="font-size:14px;color:#e8c4a0;font-family:Georgia,serif;font-weight:600;">《' + item.title + '》</div>' +
          '<div style="font-size:10px;color:rgba(232,224,212,0.25);">' + item.number + '</div>' +
        '</div>' +
        '<div style="font-size:12px;color:rgba(232,224,212,0.4);margin-bottom:4px;">' + item.tag + ' · ' + item.zoneName + '</div>' +
        '<div style="display:flex;justify-content:space-between;align-items:center;">' +
          '<div style="font-size:11px;color:rgba(232,224,212,0.25);">' + item.timeStr + ' · ' + item.collectDate + '</div>' +
          (isRare ? '<div style="font-size:10px;color:#a8895f;border:1px solid rgba(168,137,95,0.3);padding:2px 8px;">稀有馆藏</div>' : '') +
        '</div>' +
      '</div>';
  });
  list.innerHTML = html;
}

document.getElementById('historyBtn').addEventListener('click', function(e) {
  e.preventDefault();
  renderHistory();
  showPage('history');
});

document.getElementById('backFromHistory').addEventListener('click', function(e) {
  e.preventDefault();
  showPage('result');
});

/* ============================================================
   初始化
   ============================================================ */
createDust();
playEntryAnimation();

document.getElementById('enterBtn').addEventListener('click', function(e) {
  e.preventDefault();
  showPage('time');
});
</script>
